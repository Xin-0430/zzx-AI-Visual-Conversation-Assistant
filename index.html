<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI VCA — 视觉对话助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><span class="icon-eye">&#x25C8;</span></div>
      <div class="brand-text">
        <h1 class="brand-name">VCA</h1>
        <p class="brand-tagline">视觉对话助手</p>
      </div>
    </div>

    <!-- Scene Modes -->
    <nav class="mode-nav" id="modeNav">
      <div class="nav-label">场景模式</div>
      <button class="mode-chip active" data-mode="general">
        <span class="mc-icon">&#x25CB;</span><span>通用模式</span>
      </button>
      <button class="mode-chip" data-mode="visually-impaired">
        <span class="mc-icon">&#x25B3;</span><span>视障辅助</span>
      </button>
      <button class="mode-chip" data-mode="children">
        <span class="mc-icon">&#x2661;</span><span>儿童教育</span>
      </button>
      <button class="mode-chip" data-mode="elderly">
        <span class="mc-icon">&#x2666;</span><span>老人陪伴</span>
      </button>
      <button class="mode-chip" data-mode="lazy">
        <span class="mc-icon">&#x2732;</span><span>懒人模式</span>
      </button>
    </nav>

    <!-- Mode Insight -->
    <div class="insight-card" id="insightCard">
      <div class="insight-icon" id="insightIcon">&#x25CB;</div>
      <div class="insight-body">
        <div class="insight-title" id="insightTitle">通用模式</div>
        <div class="insight-desc" id="insightDesc">问问摄像头看到的一切</div>
      </div>
    </div>

    <!-- Smart Suggestions -->
    <div class="suggestion-box" id="suggestionBox">
      <div class="suggestion-label">快捷提问</div>
      <div class="suggestion-chips" id="suggestionChips"></div>
    </div>

    <!-- Visual Memory -->
    <div class="memory-section" id="memorySection">
      <div class="memory-header">
        <span class="memory-label">视觉记忆</span>
        <span class="memory-count" id="memoryCount">0</span>
      </div>
      <div class="memory-strip" id="memoryStrip">
        <div class="memory-empty">暂无记录</div>
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-actions">
      <button class="s-action" id="ambientToggle" title="环境感知模式">
        <span>&#x25CB;</span><span>环境感知</span>
      </button>
      <button class="s-action" id="settingsToggle" title="设置">
        <span>&#x2699;</span><span>设置</span>
      </button>
    </div>
    <div class="sidebar-status">
      <span class="s-dot" id="sDot"></span>
      <span class="s-text" id="sText">就绪</span>
      <span class="s-cost" id="sCost"></span>
    </div>
  </aside>

  <!-- ===== MAIN PANEL ===== -->
  <main class="main-panel">

    <!-- Camera Section -->
    <section class="camera-section" id="cameraSection">
      <div class="camera-viewport" id="cameraViewport">
        <video id="cameraFeed" autoplay playsinline muted></video>
        <canvas id="cameraCanvas" style="display:none"></canvas>

        <!-- Scene IQ Overlay -->
        <div class="scene-iq" id="sceneIQ" style="display:none">
          <div class="iq-tag iq-live">LIVE</div>
          <div class="iq-tag iq-brightness" id="iqBrightness">
            <span class="iq-icon">&#x2600;</span>
            <span class="iq-meter"><span class="iq-fill" id="iqBrightnessFill"></span></span>
          </div>
          <div class="iq-tag iq-motion" id="iqMotion" style="display:none">
            <span class="iq-dot"></span> 运动中
          </div>
          <div class="iq-tag iq-scene" id="iqScene">&#x25CB; 场景</div>
          <div class="iq-corner iq-fps" id="iqFps">-- fps</div>
          <div class="iq-corner iq-res" id="iqRes">--</div>
        </div>

        <!-- Placeholder -->
        <div class="cam-placeholder" id="camPlaceholder">
          <div class="cam-placeholder-icon">
            <svg viewBox="0 0 80 80" width="80" height="80"><circle cx="40" cy="40" r="38" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".2"/><circle cx="40" cy="40" r="28" fill="none" stroke="currentColor" stroke-width="1" opacity=".15"/><path d="M30 45 L40 35 L50 45" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".3"/></svg>
          </div>
          <p class="cam-placeholder-text">点击下方按钮打开摄像头</p>
        </div>
      </div>

      <div class="camera-toolbar">
        <button class="tool-btn" id="toggleCamera">
          <span class="tool-icon">&#x25B3;</span>
          <span class="tool-label">摄像头</span>
        </button>
        <button class="tool-btn" id="toggleMic" disabled>
          <span class="tool-icon">&#x25CB;</span>
          <span class="tool-label">麦克风</span>
        </button>
        <button class="tool-btn" id="toggleAmbient" disabled title="环境感知模式">
          <span class="tool-icon">&#x221E;</span>
          <span class="tool-label">环境感知</span>
        </button>
        <span class="tool-frame-badge" id="frameBadge" style="display:none">
          <span id="frameSizeText">0</span> KB
        </span>
      </div>
    </section>

    <!-- Chat Section -->
    <section class="chat-section">
      <div class="chat-header">
        <h2 class="chat-title">对话</h2>
        <div class="chat-actions">
          <span class="chip" id="autoSendChip">自动发送</span>
          <span class="chip" id="ttsChip">语音播报</span>
          <button class="icon-tool" id="clearChat" title="清空对话">&#x2715;</button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="msg msg-system">
          <div class="msg-body">
            <p>你好，我是 VCA — 你的视觉对话助手。</p>
            <p>打开摄像头，然后问我任何关于眼前画面的事。</p>
            <p class="msg-hint">试试说"帮我看看周围有什么"</p>
          </div>
        </div>
      </div>

      <div class="voice-indicator" id="voiceIndicator">
        <div class="voice-bar" id="voiceBar"><span></span><span></span><span></span><span></span><span></span></div>
        <span>正在聆听</span>
        <span class="voice-interim" id="voiceInterim"></span>
      </div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="输入或按住语音..." disabled></textarea>
          <button class="input-send" id="sendBtn" disabled>&#x2191;</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ===== SETTINGS MODAL ===== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-header">
      <h3>设置</h3>
      <button class="modal-x" id="settingsClose">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label>AI 服务</label>
        <select id="apiProvider">
          <option value="mock">离线模拟（免费）</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Google Gemini</option>
          <option value="deepseek">DeepSeek</option>`n          <option value="qwen">通义千问 (Qwen)</option>
        </select>
      </div>
      <div class="fg" id="apiKeyGroup">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-... 或 AIza...">
        <p class="fg-hint">密钥仅保存在本地浏览器</p>
      </div>
      <div class="fg">
        <label>帧采样（每 N 帧发送）</label>
        <div class="btn-group" id="frameIntervalGroup">
          <button data-v="1">1</button>
          <button data-v="3" class="active">3</button>
          <button data-v="5">5</button>
          <button data-v="10">10</button>
        </div>
      </div>
      <div class="fg">
        <label>图片质量</label>
        <div class="btn-group" id="qualityGroup">
          <button data-v="0.3">30%</button>
          <button data-v="0.5" class="active">50%</button>
          <button data-v="0.7">70%</button>
          <button data-v="0.9">高清</button>
        </div>
      </div>
      <div class="fg">
        <label>图片尺寸</label>
        <div class="btn-group" id="sizeGroup">
          <button data-v="320">小</button>
          <button data-v="640" class="active">中</button>
          <button data-v="1280">大</button>
        </div>
      </div>
      <div class="fg">
        <label>系统提示词（覆盖默认）</label>
        <textarea id="systemPrompt" rows="2" placeholder="留空则使用场景默认提示词"></textarea>
      </div>
      <div class="fg">
        <label>对话</label>
        <button class="btn-danger" id="clearMemoryBtn">清空视觉记忆</button>
      </div>
    </div>
  </div>
</div>

<script src="js/camera.js"></script>
<script src="js/speech.js"></script>
<script src="js/ai-service.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
