<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 视觉对话助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== Sidebar ========== -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h1 class="logo">AI VCA</h1>
    <p class="logo-sub">视觉对话助手</p>
  </div>

  <!-- Mode Selection -->
  <section class="sidebar-section" aria-label="场景模式">
    <h2 class="section-label">场景模式</h2>
    <div class="mode-list" id="modeList">
      <button class="mode-btn active" data-mode="general">
        <span class="mode-icon">&#x1F916;</span>
        <span class="mode-name">通用模式</span>
      </button>
      <button class="mode-btn" data-mode="visually-impaired">
        <span class="mode-icon">&#x1F9AF;</span>
        <span class="mode-name">视障辅助</span>
      </button>
      <button class="mode-btn" data-mode="children">
        <span class="mode-icon">&#x1F476;</span>
        <span class="mode-name">儿童教育</span>
      </button>
      <button class="mode-btn" data-mode="elderly">
        <span class="mode-icon">&#x1F474;</span>
        <span class="mode-name">老人陪伴</span>
      </button>
      <button class="mode-btn" data-mode="lazy">
        <span class="mode-icon">&#x1F634;</span>
        <span class="mode-name">懒人模式</span>
      </button>
    </div>
  </section>

  <!-- Mode description -->
  <div id="modeDescription" class="mode-description">
    <p>通用 AI 视觉对话，问问摄像头看到的一切。</p>
  </div>

  <!-- Settings -->
  <section class="sidebar-section" aria-label="设置">
    <h2 class="section-label">设置</h2>
    <div class="settings-group">
      <div class="setting-row">
        <span>语音回放</span>
        <label class="toggle">
          <input type="checkbox" id="ttsToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>自动发送</span>
        <label class="toggle">
          <input type="checkbox" id="autoSendToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <button class="setting-btn" id="settingsBtn">
        <span>&#x2699;</span> 高级设置
      </button>
    </div>
  </section>

  <!-- Connection Status -->
  <div class="sidebar-footer">
    <div class="status-indicator" id="statusIndicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
    <p class="version">v1.0 &middot; 3-Day Build</p>
  </div>
</aside>

<!-- ========== Main Area ========== -->
<main class="main-area">
  <!-- Camera Feed -->
  <section class="camera-panel" id="cameraPanel">
    <div class="camera-view" id="cameraView">
      <video id="cameraFeed" autoplay playsinline muted></video>
      <canvas id="cameraCanvas" style="display:none;"></canvas>
      <div class="camera-placeholder" id="cameraPlaceholder">
        <span class="placeholder-icon">&#x1F4F7;</span>
        <p>点击下方按钮打开摄像头</p>
      </div>
    </div>
    <div class="camera-controls">
      <button class="ctrl-btn" id="toggleCamera" aria-label="切换摄像头">
        <span>&#x1F4F7;</span> 摄像头
      </button>
      <button class="ctrl-btn" id="captureFrame" aria-label="拍摄快照" disabled>
        <span>&#x1F4F8;</span> 拍摄
      </button>
      <button class="ctrl-btn" id="toggleMic" aria-label="切换麦克风" disabled>
        <span>&#x1F3A4;</span> 麦克风
      </button>
    </div>
  </section>

  <!-- Chat Area -->
  <section class="chat-panel" aria-label="对话区">
    <div class="chat-header">
      <h2>对话</h2>
      <div class="chat-header-actions">
        <span class="frame-badge" id="frameBadge" style="display:none;">
          <span id="lastFrameSize">0</span> KB
        </span>
        <button class="icon-btn" id="clearChat" aria-label="清空对话" title="清空对话">&#x1F5D1;</button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message system">
        <div class="msg-avatar">&#x1F916;</div>
        <div class="msg-content">
          <p>你好！我是 AI 视觉对话助手。</p>
          <p>打开摄像头，然后通过语音或文字告诉我你想了解什么。</p>
          <p class="msg-hint">试试说"帮我看一下周围有什么"或点击麦克风按钮开始语音输入。</p>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="voice-indicator" id="voiceIndicator" style="display:none;">
        <span class="voice-wave"></span>
        <span>正在聆听...</span>
      </div>
      <div class="input-row">
        <textarea id="chatInput" rows="1" placeholder="输入消息或点击麦克风语音输入..." disabled></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <span>&#x27A4;</span>
        </button>
      </div>
    </div>
  </section>
</main>

<!-- ========== Settings Modal ========== -->
<div class="modal-overlay" id="settingsModal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>高级设置</h2>
      <button class="modal-close" id="settingsClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="apiProvider">AI 服务商</label>
        <select id="apiProvider">
          <option value="mock">离线模拟模式（无需 API Key）</option>
          <option value="openai">OpenAI (GPT-4o)</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>
      <div class="form-group" id="apiKeyGroup">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-... 或 AIza...">
        <p class="form-hint">密钥仅保存在浏览器本地存储中。</p>
      </div>
      <div class="form-group">
        <label for="frameInterval">帧采样间隔</label>
        <select id="frameInterval">
          <option value="1">每帧发送（实时对话）</option>
          <option value="3" selected>每 3 帧发送（推荐平衡）</option>
          <option value="5">每 5 帧发送（更省成本）</option>
          <option value="10">每 10 帧发送（最省成本）</option>
        </select>
        <p class="form-hint">降低发送频率可显著减少 API 调用费用。</p>
      </div>
      <div class="form-group">
        <label for="imageQuality">图片压缩质量</label>
        <select id="imageQuality">
          <option value="0.3">30%（最省流量）</option>
          <option value="0.5">50%（推荐平衡）</option>
          <option value="0.7">70%（高质量）</option>
          <option value="0.9">90%（最高质量）</option>
        </select>
        <p class="form-hint">降低质量可减少传输数据量，节省带宽和 API 费用。</p>
      </div>
      <div class="form-group">
        <label for="maxImageWidth">图片最大宽度</label>
        <select id="maxImageWidth">
          <option value="320">320px（最省）</option>
          <option value="640" selected>640px（推荐）</option>
          <option value="1280">1280px（高清）</option>
        </select>
      </div>
      <div class="form-group">
        <label for="systemPrompt">系统提示词（自定义行为）</label>
        <textarea id="systemPrompt" rows="3" placeholder="留空则使用场景默认提示词"></textarea>
      </div>
      <button class="btn-primary" id="saveSettings">保存设置</button>
    </div>
  </div>
</div>

<script src="js/camera.js"></script>
<script src="js/speech.js"></script>
<script src="js/ai-service.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
